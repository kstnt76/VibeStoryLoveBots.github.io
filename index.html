<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>VibeLoveStoryBot</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
  background: linear-gradient(135deg, #ffbfd5, #c9a0ff);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: env(safe-area-inset-top)
           env(safe-area-inset-right)
           env(safe-area-inset-bottom)
           env(safe-area-inset-left);
}

/* APP */
.container {
  width: 100%;
  height: 100dvh;
  max-width: 520px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: white;
}

/* LOADING */
.loading {
  text-align: center;
}

.loading-bar {
  width: 85%;
  height: 14px;
  background: rgba(255,255,255,0.3);
  border-radius: 20px;
  margin: 20px auto;
  overflow: hidden;
}

.loading-bar div {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff93b7, #ffcee0);
  animation: load 4s infinite;
}

@keyframes load {
  0% { width: 0%; }
  100% { width: 100%; }
}

/* HUD */
.game {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card {
  background: rgba(255,255,255,0.15);
  padding: 12px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
}

/* PETS */
.pets {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
}

.pet {
  width: clamp(90px, 28vw, 140px);
  height: clamp(90px, 28vw, 140px);
  border-radius: 50%;
  background: #ffe1c7;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  cursor: pointer;
  animation: float 2s infinite ease-in-out;
}

.cat { background: #b8b8d1; animation-delay: 1s; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* STATUS */
.bar {
  height: 12px;
  background: rgba(255,255,255,0.25);
  border-radius: 20px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff7fb2, #ffd0e0);
}

/* MENU */
.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: auto;
}

.btn {
  padding: 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.15);
  text-align: center;
  cursor: pointer;
}

.btn:active {
  transform: scale(0.96);
}
</style>
</head>

<body>

<div class="container" id="app">
  <div class="loading">
    <h2>Загружаем любовь 💖</h2>
    <div class="loading-bar"><div></div></div>
  </div>
</div>

<script>
let state = {
  level: 1,
  xp: 0,
  xpToNext: 100,
  coins: 10
};

function save() {
  localStorage.setItem("love", JSON.stringify(state));
}

function load() {
  const s = localStorage.getItem("love");
  if (s) state = JSON.parse(s);
}

function addXP(v) {
  state.xp += v;

  if (state.xp >= state.xpToNext) {
    state.xp -= state.xpToNext;
    state.level++;
    state.xpToNext = Math.floor(state.xpToNext * 1.2);
    alert("💖 LEVEL UP " + state.level);
  }

  update();
  save();
}

function update() {
  document.getElementById("lvl").innerText = "Level " + state.level + " 💖";
  document.getElementById("xp").innerText = state.xp + " / " + state.xpToNext;
  document.querySelector(".fill").style.width =
    (state.xp / state.xpToNext) * 100 + "%";
  document.getElementById("coins").innerText = "✨ " + state.coins;
}

function startGame() {
  document.getElementById("app").innerHTML = `
    <div class="game">

      <div class="top">
        <div class="card">
          <div id="lvl">Level ${state.level} 💖</div>
          <div id="xp">${state.xp} / ${state.xpToNext}</div>
        </div>

        <div class="card" id="coins">✨ ${state.coins}</div>
      </div>

      <div class="pets">
        <div class="pet" id="dog"></div>
        <div class="pet cat" id="cat"></div>
      </div>

      <div class="card">
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div class="menu">
        <div class="btn" data-xp="5">🌱 Питомцы</div>
        <div class="btn" data-xp="20">🎁 Подарки</div>
        <div class="btn" data-xp="8">💌 История</div>
        <div class="btn" data-xp="15">🏆 Достижения</div>
      </div>

    </div>
  `;

  document.getElementById("dog").onclick = () => addXP(10);
  document.getElementById("cat").onclick = () => addXP(12);

  document.querySelectorAll(".btn").forEach(b => {
    b.onclick = () => addXP(+b.dataset.xp);
  });

  update();

  setInterval(() => addXP(1), 5000);
}

load();
setTimeout(startGame, 2000);
</script>

</body>
</html>
